version: '3.8'

services:
  db:
    image: postgres:15
    container_name: affiliate_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-affiliate_marketing_bot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build: .
    container_name: affiliate_api
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./storage:/app/storage
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-affiliate_marketing_bot}
    depends_on:
      - db

  ui:
    build: .
    container_name: affiliate_ui
    restart: always
    command: streamlit run ui.py --server.port 8501 --server.address 0.0.0.0
    volumes:
      - ./storage:/app/storage
    ports:
      - "8501:8501"
    env_file:
      - .env
    depends_on:
      - api

volumes:
  postgres_data:
